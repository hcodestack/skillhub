[project]
name = "skillhub-server"
version = "0.1.0"
description = "Skillmgmnt — local skill inventory, load-state and usage dashboard hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
skillhub-server = "skillhub_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillhub_server"]
